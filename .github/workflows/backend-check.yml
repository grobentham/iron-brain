name: Check ICT Brain Backend

on:
  push:
    branches: [backend-v1, backend-v3.1, main]
    paths:
      - 'vercel-app/**'
      - 'api/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/backend-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vercel-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Grounding tests
        run: npm test
      - name: Safety invariants
        run: |
          grep -q "BACKEND_VERSION = '3.1.0'" api/analyze.js
          grep -q "MAX_IMAGES = 4" api/analyze.js
          grep -q "MIN_ACTIONABLE_CONFIDENCE = 60" api/analyze.js
          grep -q "DO NOT output numeric prices" api/analyze.js
          grep -q "Duplicate screenshots detected" api/analyze.js
          grep -q "execution screenshot instrument and timeframe instead of AUTO" api/analyze.js
          grep -q "OCR-grounded prices failed local trade geometry validation" api/analyze.js
          grep -q "disallowPromptTraining: true" api/analyze.js
          grep -q "FALLBACK_MODELS" api/analyze.js
          grep -q "CACHE_TTL_MS = 90_000" api/analyze.js
          grep -q "RATE_WINDOW_MS = 5 \* 60_000" api/analyze.js
          grep -q "groundingMode: 'execution-chart-only-two-pass-ocr'" api/analyze.js
          if grep -R -E '(sk-[A-Za-z0-9]|AIza[0-9A-Za-z_-]{20,}|AI_GATEWAY_API_KEY=|ICT_BRAIN_ACCESS_KEY=)' --exclude='*.md' --exclude-dir=node_modules .; then
            echo 'Possible committed secret found'
            exit 1
          fi

  root-vercel-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Validate root deployment files
        run: |
          npm run check
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s package.json
          test -s vercel.json
          test -s api/analyze.js
          test -s api/health.js
          test -s vercel-app/api/analyze.js
          test -s vercel-app/lib/grounding.js
          grep -Fq "export const config = { maxDuration: 120 };" api/analyze.js
          grep -Fq "export { default } from '../vercel-app/api/analyze.js';" api/analyze.js
          grep -q '"maxDuration": 120' vercel.json
          grep -Fq "export { default } from '../vercel-app/api/health.js';" api/health.js
          grep -q '"version": "3.1.0"' package.json
          grep -q "Find one grounded trade" index.html
          grep -q "MAX_IMAGES = 4" app.js
          node -e "import('./api/analyze.js').then(()=>console.log('root analyze wrapper import OK'))"
          node -e "import('./api/health.js').then(()=>console.log('root health wrapper import OK'))"
      - name: Scan deployable source for committed secrets
        run: |
          if grep -R -E '(sk-[A-Za-z0-9]|AIza[0-9A-Za-z_-]{20,}|AI_GATEWAY_API_KEY=|ICT_BRAIN_ACCESS_KEY=)' \
            --exclude='*.md' --exclude-dir=node_modules --exclude-dir=.git \
            api vercel-app index.html app.js styles.css package.json vercel.json; then
            echo 'Possible committed secret found'
            exit 1
          fi
