name: History
# Builds the static 2010-2024 Dukascopy hourly history on the history-data branch. Run by hand; re-run until it
# reports nothing missing. The desk workflow only reads this branch.
on:
  workflow_dispatch:
  push:
    branches: [claude/history-probe]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check out the history-data branch
        run: |
          git fetch -q --depth 1 origin history-data && git worktree add -q engine/cache/duka origin/history-data || mkdir -p engine/cache/duka
      - name: Fetch missing months
        run: python3 engine/history.py
      - name: Save to history-data
        run: |
          cd engine/cache/duka
          if [ ! -d .git ] && [ ! -f .git ]; then git init -q -b history-data; fi
          git checkout -q -B history-data
          git add -A
          git -c user.name=iron-brain -c user.email=iron-brain@users.noreply.github.com commit -q -m "Dukascopy hourly history" || echo "nothing new"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" history-data
