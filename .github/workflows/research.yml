name: Research
# Tests the pre-registered research ideas (engine/ideas.json, status "registered") and gathers the facts for the
# weekly brain report. Started by the weekly AI research session after its ideas are merged to main.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: grobentham/iron-brain-engine
          token: ${{ secrets.ENGINE_TOKEN }}
          persist-credentials: false
      - name: Connect the private engine and the public data branches
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.ENGINE_TOKEN }}@github.com/grobentham/iron-brain-engine.git"
          git remote add pub "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "numpy>=2,<3"
      - name: Long history
        run: |
          git fetch -q --depth 1 pub +refs/heads/history-data:refs/remotes/origin/history-data
          git worktree add -q --detach engine/cache/duka origin/history-data
      - name: Test the registered ideas
        run: python engine/research.py
      - name: Run the desk for the report's facts
        run: python engine/desk.py
      - name: Report facts
        run: python engine/report.py
      - name: Save to main
        run: |
          git add engine/ideas.json engine/ledger.json site/research/ideas.json site/research/brain-facts.json
          git -c user.name=iron-brain -c user.email=iron-brain@users.noreply.github.com commit -q -m "Weekly research results" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && break
            git fetch -q origin main && git -c user.name=iron-brain -c user.email=iron-brain@users.noreply.github.com rebase -q origin/main || { git rebase --abort; exit 1; }
            sleep 3
          done
