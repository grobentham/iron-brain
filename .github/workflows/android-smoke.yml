name: Smoke Test ICT Brain Android

on:
  push:
    branches: [android-apk-v2]
    paths:
      - 'android/**'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK + emulator
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Create emulator
        run: |
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name ictbrain-test --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"

      - name: Start emulator
        run: |
          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_HOME/emulator/emulator" -avd ictbrain-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > /tmp/emulator.log 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          timeout 240 bash -c 'until [ "$(/usr/local/lib/android/sdk/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82 || true

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Install and launch
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" install -r android/app/build/outputs/apk/debug/app-debug.apk
          "$ADB" logcat -c
          "$ADB" shell am start -W -n com.ictbrain.analyzer/.MainActivity | tee /tmp/start.txt
          sleep 8
          "$ADB" shell uiautomator dump /sdcard/window.xml
          "$ADB" pull /sdcard/window.xml /tmp/window.xml
          grep -q "ICT BRAIN" /tmp/window.xml
          grep -q "See the chart" /tmp/window.xml
          grep -q "Choose screenshots" /tmp/window.xml
          grep -q "Find one trade" /tmp/window.xml
          "$ADB" shell dumpsys activity activities | grep -q "com.ictbrain.analyzer/.MainActivity"

      - name: Check for fatal app crash
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" logcat -d > /tmp/logcat.txt
          if grep -E "FATAL EXCEPTION:.*|Process: com\.ictbrain\.analyzer" /tmp/logcat.txt; then
            echo "Fatal crash detected"
            exit 1
          fi
          grep -E "On-device AI|AICore|Feature" /tmp/window.xml /tmp/logcat.txt | tail -n 50 || true

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-diagnostics
          path: |
            /tmp/start.txt
            /tmp/window.xml
            /tmp/logcat.txt
            /tmp/emulator.log
          if-no-files-found: ignore
          retention-days: 7
