name: Evolve
# The brain's weekly evolution (engine/evolve.py): breed rules from the grammar on data before the seal, give the best
# a single look at the sealed last two years, register survivors and add every test to the ledger.
# Started weekly by the ticker loop on the weekend (GitHub cron here is unreliable); the cron below is a backup.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"
permissions:
  contents: write
concurrency:
  group: evolve
  cancel-in-progress: false
jobs:
  evolve:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: grobentham/iron-brain-engine
          token: ${{ secrets.ENGINE_TOKEN }}
          persist-credentials: false
      - name: Connect the private engine and the public data branches
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.ENGINE_TOKEN }}@github.com/grobentham/iron-brain-engine.git"
          git remote add pub "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "numpy>=2,<3"
      - name: Long history
        run: |
          git fetch -q --depth 1 pub +refs/heads/history-data:refs/remotes/origin/history-data
          git worktree add -q --detach engine/cache/duka origin/history-data
      - name: Evolve
        run: python engine/evolve.py
      - name: Save to main
        run: |
          git add engine/evolved.json engine/ledger.json site/research/evolve.json
          git -c user.name=iron-brain -c user.email=iron-brain@users.noreply.github.com commit -q -m "Weekly evolution" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && break
            git fetch -q origin main && git -c user.name=iron-brain -c user.email=iron-brain@users.noreply.github.com rebase -q origin/main || { git rebase --abort; exit 1; }
            sleep 3
          done
