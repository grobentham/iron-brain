name: Build ICT Brain Windows Local Engine

on:
  push:
    branches: ["main"]
    paths:
      - 'local-engine/**'
      - 'vercel-app/**'
      - 'package.json'
      - '.github/workflows/local-engine-windows.yml'
  pull_request:
    paths:
      - 'local-engine/**'
      - 'vercel-app/**'
      - 'package.json'
      - '.github/workflows/local-engine-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-local-engine:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deterministic engine dependencies
        shell: powershell
        run: npm install --omit=dev --no-audit --no-fund

      - name: Validate local engine source
        shell: powershell
        run: |
          node --check local-engine/server.mjs
          node --check local-engine/smoke-test.mjs
          node --check vercel-app/api/analyze-v64.js
          node --check vercel-app/lib/strategy-lifecycle-v6.js
          if (Select-String -Path local-engine/server.mjs -Pattern "0.0.0.0") { throw 'Local engine must not bind to all interfaces.' }
          Select-String -Path local-engine/server.mjs -Pattern "127.0.0.1"
          Select-String -Path local-engine/server.mjs -Pattern "Access-Control-Allow-Private-Network"
          Select-String -Path local-engine/server.mjs -Pattern "grobentham.github.io"

      - name: Smoke test loopback server and browser CORS
        shell: powershell
        run: node local-engine/smoke-test.mjs

      - name: Assemble portable Windows bundle
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          $bundle = Join-Path $PWD 'dist\ICTBrain-LocalEngine-v6.4'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $bundle 'runtime') | Out-Null
          Copy-Item (Get-Command node.exe).Source (Join-Path $bundle 'runtime\node.exe') -Force
          Copy-Item package.json $bundle -Force
          Copy-Item local-engine (Join-Path $bundle 'local-engine') -Recurse -Force
          Copy-Item vercel-app (Join-Path $bundle 'vercel-app') -Recurse -Force
          Copy-Item node_modules (Join-Path $bundle 'node_modules') -Recurse -Force
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath (Join-Path $PWD 'ICTBrain-LocalEngine-v6.4.zip') -CompressionLevel Optimal -Force

      - name: Upload portable Windows engine
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ICTBrain-LocalEngine-v6.4-Windows-x64
          path: ICTBrain-LocalEngine-v6.4.zip
          if-no-files-found: error
          retention-days: 30
