name: Smoke Test ICT Brain Android

on:
  push:
    branches: [android-apk-v2]
    paths:
      - 'android/**'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot emulator, install, launch, and inspect UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            set -e
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n com.ictbrain.analyzer/.MainActivity | tee /tmp/start.txt
            sleep 6
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml /tmp/window.xml
            grep -q "ICT BRAIN" /tmp/window.xml
            grep -q "See the chart" /tmp/window.xml
            grep -q "Choose screenshots" /tmp/window.xml
            grep -q "Find one grounded trade" /tmp/window.xml
            adb shell dumpsys activity activities | grep -q "com.ictbrain.analyzer/.MainActivity"
            adb logcat -d > /tmp/logcat.txt
            if grep -E "FATAL EXCEPTION:.*|Process: com\.ictbrain\.analyzer" /tmp/logcat.txt; then
              echo "Fatal crash detected"
              exit 1
            fi
            echo "Runtime smoke test passed: app installed, launched, rendered expected UI, and had no fatal crash."

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-diagnostics-v2.1
          path: |
            /tmp/start.txt
            /tmp/window.xml
            /tmp/logcat.txt
          if-no-files-found: ignore
          retention-days: 7
