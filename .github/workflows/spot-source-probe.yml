name: Verify XAUUSD data sources
on:
  push:
    branches: [codex/verify-xauusd-sources]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify five-minute XAUUSD observations
        run: |
          python3 - <<'PY'
          import datetime as dt, json, math, urllib.request
          url = "https://xaus.com/api/v1/intraday?symbol=xau&hours=48"
          request = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "Iron Brain spot outlook"})
          with urllib.request.urlopen(request, timeout=10) as response:
              data = json.load(response)
          now = dt.datetime.now(dt.timezone.utc).timestamp()
          assert data["symbol"] == "xau" and data["currency"] == "USD" and data["unit"] == "troy_oz", (data.get("symbol"),data.get("currency"),data.get("unit"))
          points = [(row["t"], row["p"]) for row in data["points"] if row["t"] <= now and math.isfinite(row["p"]) and row["p"] > 0]
          first, last = min(t for t,_ in points), max(t for t,_ in points)
          assert data["data_state"]["status"] == "fresh" and 0 <= now-last <= 900
          assert len(points)>=12 and last-first>=3600
          print("XAUS source confirmed for XAU/USD in USD per oz; samples:", len(points), "cadence:", data.get("interval_seconds"), "latest:", dt.datetime.fromtimestamp(last,dt.timezone.utc).isoformat())
          PY
