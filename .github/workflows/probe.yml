name: probe dukascopy
on:
  push:
    branches: [claude/history-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 engine/history.py
      - run: tar czf duka.tgz -C engine/cache duka && ls -la duka.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: duka
          path: duka.tgz
