name: History
# Builds the static 2010-2024 Dukascopy hourly history on the history-data branch. Run by hand; re-run until it
# reports nothing missing. The desk workflow only reads this branch.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 * * * *"   # hourly until complete; exits in seconds once nothing is missing
permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check out the history-data branch
        run: |
          git fetch -q --depth 1 origin +refs/heads/history-data:refs/remotes/origin/history-data
          git worktree add -q -B history-data engine/cache/duka origin/history-data
      - name: Fetch missing months
        run: python3 engine/history.py
      - name: Save to history-data
        if: always()
        run: |
          cd engine/cache/duka
          git add -A
          git -c user.name=iron-brain -c user.email=iron-brain@users.noreply.github.com commit -q -m "Dukascopy hourly history" || echo "nothing new"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" history-data
