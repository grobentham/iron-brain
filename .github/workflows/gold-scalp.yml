name: Gold scalp
# The registered XAUUSD breakout-scalping test (engine/gold_scalp_registered.json) on Dukascopy ticks: one job per
# month in parallel, then a collect job that judges the versions by the registered rules and commits the results.
# phase discovery: all 48 versions, Jul 2023 - Oct 2024. phase sealed: only the discovery finalists, Nov 2024 - Oct 2026.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "discovery or sealed"
        required: true
        default: "discovery"
permissions:
  contents: write
concurrency:
  group: gold-scalp
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      months: ${{ steps.m.outputs.months }}
      versions: ${{ steps.m.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: grobentham/iron-brain-engine
          token: ${{ secrets.ENGINE_TOKEN }}
          persist-credentials: false
      - name: Connect the private engine and the public data branches
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.ENGINE_TOKEN }}@github.com/grobentham/iron-brain-engine.git"
          git remote add pub "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          phase = "${{ inputs.phase }}"
          a, b = ((2023, 7), (2024, 10)) if phase == "discovery" else ((2024, 11), (2026, 10))
          ms, (y, m) = [], a
          while (y, m) <= b:
              ms.append(f"{y}-{m:02d}"); y, m = (y + 1, 1) if m == 12 else (y, m + 1)
          reg = json.load(open("engine/gold_scalp_registered.json"))
          v = "" if phase == "discovery" else ",".join(str(k) for k in reg["results"]["discovery"]["finalists"])
          print("months=" + json.dumps(ms))
          print("versions=" + v)
          PY
  month:
    needs: plan
    if: ${{ inputs.phase == 'discovery' || needs.plan.outputs.versions != '' }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        month: ${{ fromJson(needs.plan.outputs.months) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: grobentham/iron-brain-engine
          token: ${{ secrets.ENGINE_TOKEN }}
          persist-credentials: false
      - name: Connect the private engine and the public data branches
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.ENGINE_TOKEN }}@github.com/grobentham/iron-brain-engine.git"
          git remote add pub "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "numpy>=2,<3"
      - run: |
          set -o pipefail
          cd engine && python gold_ticks.py month ${{ matrix.month }} "${{ needs.plan.outputs.versions }}" | grep -v " done$" | tail -20
      - uses: actions/upload-artifact@v4
        with:
          name: gold-${{ matrix.month }}
          path: results/gold_scalp_${{ matrix.month }}.json
  collect:
    needs: [plan, month]
    if: ${{ always() }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: grobentham/iron-brain-engine
          token: ${{ secrets.ENGINE_TOKEN }}
          persist-credentials: false
      - name: Connect the private engine and the public data branches
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.ENGINE_TOKEN }}@github.com/grobentham/iron-brain-engine.git"
          git remote add pub "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "numpy>=2,<3"
      - uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true
      - name: Judge and save
        run: |
          n=$(ls results 2>/dev/null | wc -l); echo "$n month files"
          [ "$n" -gt 0 ] || { echo "no month produced results"; exit 1; }
          cd engine && python gold_ticks.py collect ${{ inputs.phase }}
          cd .. && git add engine/gold_scalp_registered.json engine/ledger.json site/research/gold-scalp.json
          git -c user.name=iron-brain -c user.email=iron-brain@users.noreply.github.com commit -q -m "Gold scalp: ${{ inputs.phase }} results" || exit 0
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:main && break
            git fetch -q origin main && git -c user.name=iron-brain -c user.email=iron-brain@users.noreply.github.com rebase -q origin/main || { git rebase --abort; exit 1; }
          done
