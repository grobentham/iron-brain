name: Smoke Test ICT Brain Android

on:
  push:
    branches: [android-apk-v2]
    paths:
      - 'android/**'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK + emulator
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"

      - name: Create emulator
        run: |
          echo no | avdmanager create avd --force --name ictbrain-test --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"

      - name: Start emulator
        run: |
          nohup emulator -avd ictbrain-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'
          adb shell input keyevent 82 || true

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Install and launch
        run: |
          adb install -r android/app/build/outputs/apk/debug/app-debug.apk
          adb logcat -c
          adb shell am start -W -n com.ictbrain.analyzer/.MainActivity | tee /tmp/start.txt
          sleep 8
          adb shell uiautomator dump /sdcard/window.xml
          adb pull /sdcard/window.xml /tmp/window.xml
          grep -q "ICT BRAIN" /tmp/window.xml
          grep -q "See the chart" /tmp/window.xml
          grep -q "Choose screenshots" /tmp/window.xml
          grep -q "Find one trade" /tmp/window.xml
          adb shell dumpsys activity activities | grep -q "com.ictbrain.analyzer/.MainActivity"

      - name: Check for fatal app crash
        run: |
          adb logcat -d > /tmp/logcat.txt
          if grep -E "FATAL EXCEPTION:.*|Process: com\.ictbrain\.analyzer" /tmp/logcat.txt; then
            echo "Fatal crash detected"
            exit 1
          fi
          grep -E "On-device AI|AICore|Feature" /tmp/window.xml /tmp/logcat.txt | tail -n 50 || true

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-diagnostics
          path: |
            /tmp/start.txt
            /tmp/window.xml
            /tmp/logcat.txt
            /tmp/emulator.log
          if-no-files-found: ignore
          retention-days: 7
